<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>trpgC — マギカロギア シートプロトタイプ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header>
    <h1>trpgC — マギカロギア プロトタイプ</h1>
    <p class="muted">PWA対応・noindex。立ち絵トリミング → 512×512 PNG 出力 / ココフォリア用JSON生成</p>
  </header>
  <main>
    <section id="editor">
      <div class="col">
        <label>キャラ名<br><input id="name" placeholder="キャラ名"></label>
        <label>イニシアチブ<br><input id="initiative" type="number" value="-1"></label>
        <details open>
          <summary>ステータス（表示用）</summary>
          <div id="statusList"></div>
          <button id="addStatus">ステータス追加</button>
        </details>
        <details>
          <summary>蔵書（grimoires）</summary>
          <div id="grimoires"></div>
          <button id="addGrimoire">蔵書を追加</button>
        </details>
        <div class="actions">
          <button id="genJson">ココフォリア用JSON生成（クリップボード＋ダウンロード）</button>
          <button id="downloadSample">サンプル読み込み</button>
        </div>
      </div>
      <div class="col">
        <h2>立ち絵（縦長対応）</h2>
        <input id="file" type="file" accept="image/*">
        <div id="cropArea">
          <canvas id="preview"></canvas>
        </div>
        <div class="cropControls">
          <label>拡大縮小: <input id="scale" type="range" min="0.5" max="2" step="0.01" value="1"></label>
          <label>Yオフセット: <input id="yoffset" type="range" min="-1000" max="1000" step="1" value="0"></label>
          <button id="exportPng">512×512 PNG を生成</button>
        </div>
        <div id="result">
          <a id="downloadPng" style="display:none">PNGダウンロード</a>
        </div>
      </div>
    </section>
    <section>
      <h3>生成プレビュー</h3>
      <pre id="previewJson" class="json"></pre>
    </section>
  </main>
  <footer>
    <small>Prototype — GitHub Pages にデプロイ可能</small>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>

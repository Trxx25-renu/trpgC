<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>trpgC — キャラクターページ</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .char-card{max-width:900px;margin:20px auto;padding:16px;background:#fff;border-radius:8px}
    .char-head{display:flex;gap:16px}
    .avatar{width:220px;height:220px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .meta{flex:1}
    .labels{margin-top:8px}
    .labels b{display:inline-block;width:120px}
    .grimoires{margin-top:12px}
    .token-actions{margin-top:12px;display:flex;gap:8px}
    #tokens{margin-top:16px;display:block}
    .token-item{width:96px;height:96px;border:1px solid #ddd;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .muted{color:#6b7280}
    pre.json-output{background:#0b1220;color:#dff0ff;padding:12px;border-radius:6px;max-height:300px;overflow:auto}
  </style>
</head>
<body>
  <main>
    <div class="char-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h1 id="charName">キャラクター</h1>
        <div><a href="/">← エディタに戻る</a></div>
      </div>
      <div class="char-head">
        <div class="avatar" id="avatar"><img id="avatarImg" alt="立ち絵" src="icons/icon.svg"></div>
        <div class="meta">
          <div class="labels"><div><b>イニシアチブ</b><span id="initiative">-</span></div></div>
          <div class="labels"><b>ステータス</b><div id="statusList"></div></div>
          <div class="grimoires"><b>蔵書</b><div id="grimoires"></div></div>
          <div class="token-actions">
            <button id="makeToken">ココフォリア用コマ(JSON)をコピー</button>
            <button id="copyJson">キャラJSONをコピー</button>
          </div>
          <div class="muted" style="margin-top:8px">「ココフォリア用コマ」は画像を作らず、ココフォリアに貼るためのJSONをクリップボードにコピーします。</div>
        </div>
      </div>
      <section>
        <h3>生成プレビュー（JSON）</h3>
        <pre id="tokens" class="json-output" aria-live="polite"></pre>
      </section>
    </div>
  </main>
  <script src="assets/character.js"></script>
</body>
</html>
